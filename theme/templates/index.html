<!doctype html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under construction | {{ SITENAME }}</title>
  <meta name="description" content="Farid Mirzayev's website is under construction.">
  <meta name="theme-color" content="#e9e7df">
  <link rel="canonical" href="{{ SITEURL }}/">
  <link rel="alternate" type="application/rss+xml" title="{{ SITENAME }} RSS" href="{{ SITEURL }}/index.xml">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/site.css">
  <link rel="icon" href="{{ SITEURL }}/images/favicon.ico">
</head>
<body class="construction-page">
  <!--
  THESIS: A personal website visibly being built, not a finished portfolio or a generic holding page.
  OWN-WORLD: Warm blueprint paper, graphite steel, safety orange, sea-glass teal, and a hand-built miniature crane site.
  STORY: Farid is building a new home on the web; the crane lifts a piece into place while a builder works nearby.
  FIRST VIEWPORT: A large status headline anchors the left; a full-bleed animated Three.js construction diorama fills the screen.
  FORM: Single-scene construction tableau with a gently moving crane load and worker; no navigation or scroll.
  -->
  <main class="construction">
    <canvas class="construction__scene" id="construction-scene" aria-hidden="true"></canvas>
    <div class="construction__grid" aria-hidden="true"></div>
    <section class="construction__message" aria-labelledby="construction-title">
      <p class="construction__eyebrow">A little work in progress</p>
      <h1 id="construction-title">Under<br>construction<span>.</span></h1>
      <p class="construction__copy">I’m building a new home for my work on the web. Check back soon.</p>
    </section>
    <p class="construction__fallback" id="construction-fallback" role="status" hidden></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script type="module" src="{{ SITEURL }}/theme/js/construction.js"></script>
</body>
</html>
