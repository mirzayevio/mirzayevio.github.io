{% extends "base.html" %}
{% block title %}{{ page.title }} | {{ SITENAME }}{% endblock %}
{% block description %}{{ page.summary|striptags }}{% endblock %}
{% block canonical %}{{ SITEURL }}/{{ page.url }}{% endblock %}
{% block content %}
<article class="prose-page">
  <h1>{{ page.title }}</h1>
  <div class="prose">{{ page.content }}</div>
</article>
{% endblock %}
